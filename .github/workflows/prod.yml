name: Prod Pipeline

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/deployments/prod
            docker pull omardiab04/book-shop:${{ vars.IMAGE_VERSION }}
            docker tag omardiab04/book-shop:${{ vars.IMAGE_VERSION }} omardiab04/book-shop:latest
            docker-compose down
            docker-compose up -d
            docker-compose exec -T backend python manage.py migrate